services:
  erpdb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: erpprd01
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LegacyLab!2026"   # lab-only password, nothing real lives here
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - ./db:/db:ro
      - erpdata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LegacyLab!2026' -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  erpdata:
